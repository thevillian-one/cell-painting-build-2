name: Stage 1A - cohort acquisition

on:
  workflow_dispatch:
    inputs:
      confirm_no_paid_usage:
        description: 'I authorize Stage 1A public data downloads and have disabled paid Actions overages (or have no payment method).'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cell-painting-stage1a
  cancel-in-progress: false

jobs:
  acquire:
    # Never launch this job in a private repository or on a larger paid runner.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: '1'
      CONFIRM_NO_PAID_USAGE: ${{ inputs.confirm_no_paid_usage }}
    steps:
      - name: Check explicit authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRM_NO_PAID_USAGE" != "true" ]; then
            echo '::error::No acquisition authorized. Start a NEW Run workflow and tick the confirmation checkbox.'
            exit 1
          fi

      - name: Fetch exact public commit and verify Stage 1 package
        shell: bash
        run: |
          set -euo pipefail
          {
            git init -b main .
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git fetch --depth=1 --no-tags origin "${GITHUB_SHA}"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
            sha256sum --check STAGE1_CHECKSUMS.sha256
          } 2>&1 | tee stage1-bootstrap-console.log

      - name: Set up compatible acquisition runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Run offline acquisition tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s stage1/tests -p 'test_*.py' -v 2>&1 | tee stage1-tests-console.log

      - name: Acquire Stage 1A data and metadata only
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 45m python stage1/scripts/collect_stage1.py \
            --config stage1/configs/acquisition.json \
            --output stage1-output 2>&1 | tee stage1-acquisition-console.log

      - name: Finalize evidence even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f stage1/scripts/finalize_artifact.py ]; then
            python stage1/scripts/finalize_artifact.py --root stage1-output --repo .
          else
            mkdir -p stage1-output/logs
            cp stage1-*-console.log stage1-output/logs/ 2>/dev/null || true
            printf 'Stage 1 BLOCKED. Package/authorization/runtime failed before collector startup. No scientific gate passed.\n' > stage1-output/BUILD_STATUS.md
            printf 'Repository: %s\nCommit: %s\nRun: %s\nAttempt: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > stage1-output/logs/workflow-context.txt
            (cd stage1-output && find . -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256)
          fi

      - name: Return acquisition evidence for Stage 1 review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node.js 24
        with:
          name: stage1-acquisition
          path: stage1-output/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
