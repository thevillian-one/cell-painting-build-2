name: Stage 0 - access and runtime

on:
  workflow_dispatch:
    inputs:
      confirm_no_paid_usage:
        description: 'I have disabled paid Actions overages, or have no payment method on GitHub.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cell-painting-stage0
  cancel-in-progress: false

jobs:
  preflight:
    # Safety: no private-repository paid minutes and no larger/paid runner.
    if: github.event.repository.private == false && inputs.confirm_no_paid_usage == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - name: Fetch this exact public bootstrap commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 --no-tags origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          sha256sum --check BOOTSTRAP_CHECKSUMS.sha256

      - name: Set up compatible Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Run Stage 0 only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_stage0.py 2>&1 | tee bootstrap-console.log

      - name: Preserve diagnostics even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p stage0-output/logs
          if [ -f bootstrap-console.log ]; then
            cp bootstrap-console.log stage0-output/logs/bootstrap-console.log
          fi
          printf 'Run ID: %s\nAttempt: %s\nBootstrap commit: %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > stage0-output/logs/workflow-context.txt
          # Add final console/context hashes after the Python checkpoint closed.
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('stage0-output')
          def digest(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''): h.update(b)
              return h.hexdigest()
          files=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='CHECKSUMS.sha256')
          (root/'CHECKSUMS.sha256').write_text(''.join(f'{digest(p)}  {p.relative_to(root).as_posix()}\n' for p in files))
          PY

      - name: Return Stage 0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage0-evidence
          path: stage0-output/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 3
